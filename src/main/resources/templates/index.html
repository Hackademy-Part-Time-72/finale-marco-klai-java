<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:fragment="head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Aulab Chronicle</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Aggiunto FontAwesome per caricare correttamente l'icona della campanella -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>
    <nav th:fragment="navbar" class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">Aulab Chronicle</a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/article/index}">Tutti gli articoli</a>
                    </li>
                    <li class="nav-item" sec:authorize="isAnonymous()">
                        <a class="nav-link" th:href="@{/register}">Registrati</a>
                    </li>
                    <li class="nav-item" sec:authorize="isAnonymous()">
                        <a class="nav-link" th:href="@{/login}">Login</a>
                    </li>
                    
                    <!-- Pulsante Dashboard Admin con campanella delle notifiche integrata -->
                    <li class="nav-item" sec:authorize="hasRole('ROLE_ADMIN')">
                        <div class="d-flex">
                            <a class="nav-link text-danger fw-bold" th:href="@{/admin/dashboard}">Dashboard Admin</a>
                            <div class="mt-1" th:if="${careerRequests != null and careerRequests > 0}">
                                <i class="fas fa-bell pt-2" style="color: #dc3545;"></i>
                                <span class="badge rounded-pill bg-danger text-white px-1" th:text="${careerRequests}"></span>
                            </div>
                        </div>
                    </li>

                    <!-- Pulsante Dashboard Revisor con campanella delle notifiche integrata -->
                    <li class="nav-item" sec:authorize="hasRole('ROLE_REVISOR')">
                        <div class="d-flex">
                            <a class="nav-link fw-bold" th:href="@{/revisor/dashboard}">Dashboard revisor</a>
                            <div class="mt-1" th:if="${articlesToBeRevised != null and articlesToBeRevised > 0}">
                                <i class="fas fa-bell pt-2" style="color: #dc3545;"></i>
                                <span class="badge rounded-pill bg-danger text-white px-1" th:text="${articlesToBeRevised}"></span>
                            </div>
                        </div>
                    </li>

                    <li class="nav-item" sec:authorize="hasRole('ROLE_WRITER')">
                        <a class="nav-link" href="/writer/dashboard">Dashboard writer</a>
                    </li>

                    <li class="nav-item" sec:authorize="isAuthenticated()">
                        <a class="nav-link text-primary fw-bold" th:href="@{/categories}">Categorie</a>
                    </li>
                    
                    <!-- MODIFICA APPLICATA QUI -->
                    <li class="nav-item" sec:authorize="isAuthenticated() && hasRole('ROLE_WRITER')">
                        <a class="nav-link text-success fw-bold" th:href="@{/article/create}">Inserisci articolo</a>
                    </li>

                    <li class="nav-item" sec:authorize="isAuthenticated()">
                        <a class="nav-link" th:href="@{/logout}">Logout</a>
                    </li>
                </ul>

                <form class="d-flex" th:action="@{/article/search}" method="get">
                    <input class="form-control me-2" type="search" placeholder="Search" name="keyword" aria-label="Search">
                    <button class="btn btn-outline-success" type="submit">Search</button>
                </form>
            </div>
        </div>
    </nav>

    <!-- Footer -->
    <footer th:fragment="footer" class="bg-dark text-white pt-4">
        <div class="container">
            <div class="row justify-content-between">
                <!-- Company Info -->
                <div class="col-md-4 mb-3">
                    <a href="/" class="text-white text-decoration-none"><h5>Aulab IT</h5></a>
                </div>
                <!-- Contact Info -->
                <div class="col-md-4 mb-3 text-end">
                    <h5>Lavora con noi</h5>
                    <a th:href="@{/operations/career/request}" class="btn btn-primary">Richiedi</a>
                </div>
            </div>
        </div>
        <div class="bg-secondary text-center py-2">
            <p class="mb-0">© 2026 Aulab Chronicle. All rights reserved.</p>
        </div>
    </footer>
    <!-- fine del footer -->

    <!-- fragment script bootstrap -->
    <script th:fragment="bootstrapScript" src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <!-- fine fragment script bootstrap -->
</body>
</html>
