<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head th:insert="~{index :: head}"></head>
<body>
    <nav th:insert="~{index :: navbar}"></nav>

    <div class="container mt-5 min-vh-100">
        <!-- Sezione Richieste di Collaborazione -->
        <h1 class="mb-4" th:text="${title}"></h1>

        <div th:if="${successMessage}" class="alert alert-success">
            <p th:text="${successMessage}" class="mb-0"></p>
        </div>

        <table class="table table-striped" th:unless="${#lists.isEmpty(requests)}">
            <thead>
                <tr>
                    <th>Utente</th>
                    <th>Email</th>
                    <th>Ruolo Richiesto</th>
                    <th>Azioni</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="req : ${requests}">
                    <td th:text="${req.user.username}"></td>
                    <td th:text="${req.user.email}"></td>
                    <td th:text="${req.role.name}"></td>
                    <td>
                        <a th:href="@{/operations/career/request/detail/{id}(id=${req.id})}" class="btn btn-primary btn-sm">Visualizza</a>
                    </td>
                </tr>
            </tbody>
        </table>

        <div th:if="${#lists.isEmpty(requests)}" class="alert alert-info">
            Non ci sono nuove richieste di collaborazione in sospeso.
        </div>

        <!-- Sezione Gestione Categorie -->
        <div class="row">
            <div class="col-12 my-5 d-flex justify-content-center align-items-center">
                <span class="h1">Tutte le categorie</span>
                <a th:href="@{/categories/create}" class="btn btn-primary m-2">
                    <i class="fa-solid fa-plus"></i>
                </a>
            </div>

            <div class="col-12">
                <table class="table table-striped table-responsive-lg">
                    <thead>
                        <tr>
                            <th>Id</th>
                            <th>Nome</th>
                            <th class="text-end">#Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="category : ${categories}">
                            <td th:text="${category.id}"></td>
                            <td th:text="${category.name}"></td>
                            <td class="text-end">
                                <!-- Pulsante Modifica Categoria -->
                                <a th:href="@{/categories/edit/{id}(id=${category.id})}" class="btn btn-warning m-2">
                                    <i class="fa-solid fa-pencil"></i>
                                </a>
                                <!-- Pulsante Elimina Categoria -->
                                <a th:href="@{/categories/delete/{id}(id=${category.id})}" class="btn btn-danger m-2">
                                    <i class="fa-solid fa-trash"></i>
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <footer th:insert="~{index :: footer}"></footer>
    <script th:replace="~{index :: bootstrapScript}"></script>
</body>
</html>
